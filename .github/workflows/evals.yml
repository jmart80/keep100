name: Evals

# Real model runs. They cost money, so this runs only when started by hand.
# Needs a repository secret named ANTHROPIC_API_KEY.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to run (smoke, job, guard, b2b, b2c, or a skill name). Empty runs everything."
        required: false
        default: "smoke"
      runs:
        description: "Runs per case"
        required: false
        default: "1"
      max_cost_usd:
        description: "Stop when the run has cost this much"
        required: false
        default: "15"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      # The eval runner refuses any run that is granted Bash unless it can sandbox it.
      - name: Install the sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run eval cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG: ${{ inputs.tag }}
          RUNS: ${{ inputs.runs }}
          MAX_COST: ${{ inputs.max_cost_usd }}
          # Run folders must sit outside /tmp. The sandbox makes everything under /tmp read-only.
          TMPDIR: ${{ runner.temp }}
        run: |
          args=(--trust-plugin --scaffold --allow-tools Write Edit Bash --no-publish
                --runs "$RUNS" --max-cost-usd "$MAX_COST" --threshold 0.8 --judge-model sonnet
                --json results.json)
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          claude plugin eval . "${args[@]}"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            results.json
            evals/results/
