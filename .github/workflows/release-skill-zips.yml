name: Build skill zips for browser users

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each skill, then bundle them
        run: |
          mkdir -p dist/skills
          for dir in skills/*/; do
            name=$(basename "$dir")
            (cd skills && zip -rq "../dist/skills/${name}.zip" "$name")
          done
          (cd dist/skills && zip -q ../keep100-skills.zip *.zip)
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/keep100-skills.zip --clobber
      - name: Keep as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: keep100-skills
          path: dist/keep100-skills.zip
