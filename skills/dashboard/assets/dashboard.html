<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keep100 progress</title>
<style>
  :root {
    --bg: #0e2a1e;
    --bg-deep: #0a2117;
    --line: rgba(233, 241, 234, 0.07);
    --rule: rgba(233, 241, 234, 0.16);
    --ink: #e9f1ea;
    --muted: #8fb09c;
    --accent: #2df07a;
    --accent-ink: #062414;
    --pie-rest: #173d2c;
    --warn: #f2c46b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f6f1;
      --bg-deep: #e8eee7;
      --line: rgba(14, 42, 30, 0.06);
      --rule: rgba(14, 42, 30, 0.18);
      --ink: #0e2a1e;
      --muted: #55705f;
      --accent: #0b8f45;
      --accent-ink: #ffffff;
      --pie-rest: #d4dfd5;
      --warn: #8a5a00;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 44px 44px;
    font-family: Inter, "SF Pro Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  .page { max-width: 1060px; margin: 0 auto; padding: 36px 28px 56px; }

  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
  .top p { margin: 0; color: var(--muted); font-size: 0.95rem; }

  .hero { display: grid; grid-template-columns: 208px 1fr; gap: 44px; align-items: center; margin: 44px 0 40px; }
  .pie { width: 208px; height: 208px; display: block; }
  .pie .rest { fill: var(--pie-rest); }
  .pie .done { fill: none; stroke: var(--accent); stroke-width: 50; transform: rotate(-90deg); transform-origin: 50px 50px; transition: stroke-dasharray 900ms cubic-bezier(0.2, 0.7, 0.2, 1); }
  .hero h2 { margin: 0 0 14px; font-size: clamp(2rem, 5.2vw, 3.5rem); line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; text-wrap: balance; }
  .hero .how { margin: 0; font-size: 1.1rem; color: var(--muted); max-width: 34em; }
  .hero .how strong { color: var(--ink); font-weight: 600; }
  .count { margin: 0 0 10px; font-size: 1.05rem; font-weight: 600; color: var(--accent); }

  .facts { display: flex; flex-wrap: wrap; gap: 10px 40px; margin: 0; padding: 18px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .facts div { display: flex; align-items: baseline; gap: 8px; }
  .facts dt { order: 2; color: var(--muted); }
  .facts dd { order: 1; margin: 0; font-weight: 700; font-size: 1.25rem; letter-spacing: -0.01em; }

  .cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 56px; margin-top: 40px; }
  h3 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.015em; }

  .phase { margin-bottom: 34px; }
  .phase-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .phase-head span { color: var(--muted); font-size: 0.95rem; white-space: nowrap; }
  .phase.complete .phase-head span { color: var(--accent); font-weight: 600; }

  .steps { list-style: none; margin: 0; padding: 0; position: relative; }
  .steps::before { content: ""; position: absolute; left: 11px; top: 14px; bottom: 14px; width: 2px; background: var(--rule); }
  .step { position: relative; display: flex; gap: 14px; align-items: flex-start; padding: 7px 0; }
  .mark { flex: none; width: 24px; height: 24px; border-radius: 50%; position: relative; z-index: 1; background: var(--bg); border: 2px solid var(--muted); display: grid; place-items: center; }
  .mark svg { width: 13px; height: 13px; display: none; }
  .step .label { padding-top: 0; }
  .step .note { display: block; color: var(--muted); font-size: 0.9rem; }

  .step.done .mark { background: var(--accent); border-color: var(--accent); }
  .step.done .mark svg { display: block; stroke: var(--accent-ink); }
  .step.done .label { color: var(--muted); }

  .step.next .mark { border-color: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 22%, transparent); }
  .step.next .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .step.next .label { font-weight: 700; }
  .step.next .tag { display: inline-block; margin-left: 10px; padding: 1px 9px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 0.8rem; font-weight: 700; vertical-align: 2px; }

  .step.skipped .mark { border-style: dashed; }
  .step.skipped .label { color: var(--muted); }
  .step.skipped .name { text-decoration: line-through; text-decoration-thickness: 1px; }

  .side section { padding-bottom: 26px; margin-bottom: 26px; border-bottom: 1px solid var(--rule); }
  .side section:last-child { border-bottom: 0; }
  .side h3 { margin-bottom: 12px; }
  .side ul { list-style: none; margin: 0; padding: 0; }
  .side li { padding: 5px 0; }
  .files li { display: flex; justify-content: space-between; gap: 12px; }
  .files .status { color: var(--muted); white-space: nowrap; }
  .files .status.confirmed { color: var(--accent); font-weight: 600; }
  .files .status.provisional { color: var(--warn); }
  .numbers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0; }
  .numbers div { display: flex; flex-direction: column-reverse; }
  .numbers dt { color: var(--muted); font-size: 0.9rem; }
  .numbers dd { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
  .plain li { color: var(--muted); font-size: 0.95rem; }
  .empty { color: var(--muted); margin: 0; }

  .foot { margin-top: 44px; color: var(--muted); font-size: 0.9rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  @media (max-width: 820px) {
    .page { padding: 24px 18px 40px; }
    .hero { grid-template-columns: 1fr; gap: 24px; margin: 28px 0; }
    .pie { width: 132px; height: 132px; }
    .cols { grid-template-columns: 1fr; gap: 36px; }
  }
  @media (prefers-reduced-motion: reduce) { .pie .done { transition: none; } }
  @media print { body { background: #fff; color: #000; } .pie .done { transition: none; } }
</style>
</head>
<body>
<main class="page" id="app">
  <header class="top">
    <h1 id="product">Keep100</h1>
    <p id="track"></p>
  </header>

  <section class="hero" aria-labelledby="headline">
    <svg class="pie" viewBox="0 0 100 100" role="img" aria-labelledby="pie-title">
      <title id="pie-title">Progress</title>
      <circle class="rest" cx="50" cy="50" r="50"></circle>
      <circle class="done" id="pie-done" cx="50" cy="50" r="25" stroke-dasharray="0 157.08"></circle>
    </svg>
    <div>
      <p class="count" id="count"></p>
      <h2 id="headline"></h2>
      <p class="how" id="how"></p>
    </div>
  </section>

  <dl class="facts" id="facts"></dl>

  <div class="cols">
    <div id="checklist"></div>
    <aside class="side" id="side"></aside>
  </div>

  <p class="foot" id="foot"></p>
</main>

<script id="keep100-data" type="application/json">/*KEEP100_DATA*/</script>
<script>
(function () {
  var raw = document.getElementById("keep100-data").textContent;
  var data;
  try { data = JSON.parse(raw); } catch (e) { data = null; }
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  if (!data) {
    $("headline").textContent = "No progress to show yet";
    $("how").textContent = "Open Claude in your Keep100 folder and say \"show me my dashboard\".";
    return;
  }

  document.title = (data.product || "Keep100") + " progress";
  $("product").textContent = data.product || "Keep100";
  $("track").textContent = "Keep100" + (data.track ? ", " + data.track + " track" : "");

  var total = data.steps_total || 0, done = data.steps_done || 0;
  var share = total ? done / total : 0;
  $("pie-title").textContent = done + " of " + total + " steps done";
  $("count").textContent = total ? done + " of " + total + " steps done" : "";

  if (data.paying_customers > 0 && !data.next) {
    $("headline").textContent = "You kept 100%, and you have " + plural(data.paying_customers, "paying customer", "paying customers");
    $("how").textContent = "Every step is done. The weekly rhythm is the plan now. Say \"what's today\" in Claude to carry on.";
  } else if (data.next) {
    $("headline").textContent = "Next: " + data.next.label;
    var how = $("how");
    how.append("Open Claude in your Keep100 folder and say ");
    how.append(el("strong", null, "“what’s today”"));
    how.append(". Claude ticks this page off as each step is done.");
  } else {
    $("headline").textContent = "Every step is done";
    $("how").textContent = "The weekly rhythm is the plan now. Say \"what's today\" in Claude to carry on.";
  }

  var facts = $("facts");
  function fact(value, label) {
    var row = el("div");
    row.append(el("dt", null, label), el("dd", null, value));
    facts.append(row);
  }
  fact(String(data.paying_customers || 0), data.paying_customers === 1 ? "paying customer" : "paying customers");
  if (data.days_in) fact("Day " + data.days_in, "since you started");
  if (data.hours_a_day) fact(data.hours_a_day, "a day");
  if (data.started_text) fact(data.started_text, "start date");

  var check = '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.2 8.4l3.1 3.1 6.5-7"/></svg>';
  var list = $("checklist");
  (data.sections || []).forEach(function (section) {
    var items = section.items || [];
    var finished = items.filter(function (i) { return i.state !== "todo"; }).length;
    var doneCount = items.filter(function (i) { return i.state === "done"; }).length;
    var wrap = el("section", "phase" + (finished === items.length ? " complete" : ""));
    var head = el("div", "phase-head");
    head.append(el("h3", null, section.title));
    head.append(el("span", null, finished === items.length ? "Done" : doneCount + " of " + items.length));
    wrap.append(head);
    var ul = el("ul", "steps");
    items.forEach(function (item) {
      var isNext = data.next && data.next.label === item.label && data.next.section === section.title;
      var state = isNext ? "next" : item.state;
      var li = el("li", "step " + state);
      var mark = el("span", "mark");
      mark.innerHTML = check;
      var words = { done: "Done: ", next: "Next: ", todo: "To do: ", skipped: "Skipped: " };
      var label = el("span", "label");
      label.append(el("span", "sr", words[state]));
      label.append(el("span", "name", item.label));
      if (isNext) label.append(el("span", "tag", "Next"));
      if (item.note) label.append(el("span", "note", item.note));
      li.append(mark, label);
      ul.append(li);
    });
    wrap.append(ul);
    list.append(wrap);
  });

  var side = $("side");
  function block(title) {
    var s = el("section");
    s.append(el("h3", null, title));
    side.append(s);
    return s;
  }

  var numbers = data.pipeline || data.numbers;
  if (numbers) {
    var s1 = block(data.pipeline ? "Outreach so far" : "Last week");
    var dl = el("dl", "numbers");
    [["reached", "reached"], ["replies", data.pipeline ? "replies" : "replies or signups"], ["calls", "calls"], ["paid", "paid"]].forEach(function (pair) {
      var d = el("div");
      d.append(el("dt", null, pair[1]), el("dd", null, String(numbers[pair[0]] === undefined || numbers[pair[0]] === "" ? 0 : numbers[pair[0]])));
      dl.append(d);
    });
    s1.append(dl);
    if (data.pipeline && data.pipeline.waiting !== undefined) {
      s1.append(el("p", "empty", plural(data.pipeline.waiting, "person", "people") + " waiting in the queue"));
    }
  }

  var s2 = block("Company files");
  if ((data.company || []).length) {
    var ul2 = el("ul", "files");
    data.company.forEach(function (file) {
      var li = el("li");
      li.append(el("span", null, file.name));
      li.append(el("span", "status " + String(file.status || "").toLowerCase(), file.status || "Draft"));
      ul2.append(li);
    });
    s2.append(ul2);
  } else {
    s2.append(el("p", "empty", "No company files yet."));
  }

  if ((data.open_loops || []).length) {
    var s3 = block("Waiting on someone");
    var ul3 = el("ul", "plain");
    data.open_loops.forEach(function (line) { ul3.append(el("li", null, line)); });
    s3.append(ul3);
  }

  var s4 = block("Recent work");
  if ((data.work_log || []).length) {
    var ul4 = el("ul", "plain");
    data.work_log.forEach(function (line) { ul4.append(el("li", null, line)); });
    s4.append(ul4);
  } else {
    s4.append(el("p", "empty", "Finished work shows up here."));
  }

  $("foot").textContent = "Updated " + (data.updated_text || "") + ". This page is built from progress.md in your Keep100 folder.";

  var arc = (share * 157.08).toFixed(2) + " 157.08";
  var pie = $("pie-done");
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (still) { pie.setAttribute("stroke-dasharray", arc); }
  else { requestAnimationFrame(function () { requestAnimationFrame(function () { pie.setAttribute("stroke-dasharray", arc); }); }); }
})();
</script>
</body>
</html>
